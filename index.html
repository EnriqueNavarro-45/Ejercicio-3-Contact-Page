<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.ico">
    <link rel="stylesheet" href="CSS/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="logo">
        <img src="images/Logo.svg" alt="logo">
        </div>

    <main id="container">
        <h1 class="titulo">Interested in our business pricing?</h1>

        <p class="texto">
            Fill out the form to view details and we'll contact you as soon as possible
        </p>

        <form id="formulario">

            <div class="fila">
                <div class="campo">
                    <label>Name</label>
                    <input type="text" placeholder="name" required>
                </div>

                <div class="campo">
                    <label>Company Email</label>
                    <input type="email" placeholder="example@johnson.com" required>
                </div>
            </div>

            <div class="fila">
                <div class="campo">
                    <label>Company Size</label>
                    <select required>
                        <option selected>Select option</option>
                        <option>10-50 employees</option>
                        <option>50-100 employees</option>
                        <option>100+ employees</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Subject</label>
                    <select required>
                        <option selected>Select option</option>
                        <option>Building Landing pages </option>
                        <option>Web Development</option>
                        <option>UI/UX Design</option>
                    </select>
                </div>
            </div>

            <div class="campo">
                <label>Message</label>
                <textarea placeholder="Tell us about your project..." required></textarea>
            </div>

            <button type="submit">Contact Sales</button>
        </form>
    </main>
    
</body>
</html>
